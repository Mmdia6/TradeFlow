services:
  api:
    build:
      context: ./backend
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tradeflow}
      MYSQL_USER: ${MYSQL_USER:-tradeflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tradeflow}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
volumes:
  mysql_data:
  redis_data:
